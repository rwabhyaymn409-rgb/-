name: Build Pixel 6 Pro Kernel Driver

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'kernel/**'
      - '.github/workflows/**'

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang lld llvm flex gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev lz4 make python3 rsync unzip zip curl

      - name: Fetch Kernel 6.1 Source
        run: |
          echo "[*] Cloning 6.1 kernel tree..."
          git clone --depth=1 -b upstream-linux-6.1.y https://android.googlesource.com/kernel/common $HOME/android_kernel

      - name: Prepare Kernel Headers (Matching exact vermagic)
        run: |
          cd $HOME/android_kernel
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 145/' Makefile
          make ARCH=arm64 LLVM=1 defconfig
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-android14-11-gfa1d6308d1fe-ab14691759"/' .config
          echo 'CONFIG_LOCALVERSION="-android14-11-gfa1d6308d1fe-ab14691759"' >> .config
          echo 'CONFIG_LOCALVERSION_AUTO=n' >> .config
          make ARCH=arm64 LLVM=1 modules_prepare -j$(nproc)

      - name: Compile ff_kdriver.ko
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 -C $HOME/android_kernel M=$(pwd) modules -j$(nproc)
          ls -la ff_kdriver.ko

      - name: Upload Kernel Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff_kdriver-pixel6pro
          path: kernel/ff_kdriver.ko
