name: Build Pixel 6 Pro Kernel Driver

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'kernel/**'
      - '.github/workflows/**'

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang lld llvm flex gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev lz4 make python3 rsync unzip zip curl

      - name: Fetch GKI Kernel Source (Pixel 6 Pro raviole)
        run: |
          echo "[*] Cloning Pixel 6 Pro / GKI kernel tree..."
          git clone --depth=1 -b main-16k-gs-raviole-5.10 https://android.googlesource.com/kernel/common $HOME/android_kernel || \
          git clone --depth=1 -b upstream-linux-5.10.y https://android.googlesource.com/kernel/common $HOME/android_kernel || \
          git clone --depth=1 -b android16-6.12 https://android.googlesource.com/kernel/common $HOME/android_kernel

      - name: Prepare Kernel Headers
        run: |
          cd $HOME/android_kernel
          make ARCH=arm64 LLVM=1 defconfig
          make ARCH=arm64 LLVM=1 modules_prepare -j$(nproc)

      - name: Compile ff_kdriver.ko
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 -C $HOME/android_kernel M=$(pwd) modules -j$(nproc)
          ls -la ff_kdriver.ko

      - name: Upload Kernel Driver Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff_kdriver-pixel6pro
          path: kernel/ff_kdriver.ko
